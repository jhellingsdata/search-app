[project]
name = "eco-search-backend"
version = "0.1.0"
description = "Economics Observatory semantic search: API and article update pipeline"
readme = "UPDATING.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "beautifulsoup4>=4.13.3,<5.0.0",
    "boto3>=1.36.24,<2.0.0",
    "fastapi>=0.115.8,<1.0.0",
    "fastapi-cors>=0.0.6,<1.0.0",
    "openai>=1.63.2,<2.0.0",
    "pandas>=2.2.3,<3.0.0",
    "pinecone>=6.0.1,<7.4.0",
    "python-dotenv>=1.0.1,<2.0.0",
    "requests>=2.32.3,<3.0.0",
    "slowapi>=0.1.9,<1.1.0",
    "tqdm>=4.67.1,<5.0.0",
    "uvicorn[standard]>=0.34.0,<1.0.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["app", "."]

[dependency-groups]
dev = [
    "ipykernel>=7.4.0",
    "pytest>=9.1.1",
]
