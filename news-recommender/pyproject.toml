[project]
name = "eco-news-recommender"
version = "0.1.0"
description = "Automated news-to-article recommender for the Economics Observatory"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27.0",
    "beautifulsoup4>=4.12.0",
    "lxml>=5.2.0",
]

[project.optional-dependencies]
phase2 = [
    "feedparser>=6.0.11",
    "sentence-transformers>=3.0.0",
    "openai>=1.30.0",
    "numpy>=1.26.0",
]
phase3 = [
    "openai>=1.30.0",
    "boto3>=1.34.0",
    "jinja2>=3.1.0",
]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.4.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I"]
